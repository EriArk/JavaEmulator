pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
rootProject.name = "AbyssME"
include ':app', ':dexlib'
include ':peer-core'
project(':peer-core').projectDir = file('engines/peer/core')
if (['symbianExperiment', 'symbianRelease', 'symbianReleaseCheck'].any { providers.gradleProperty(it).orNull == 'true' }) {
    include ':symbian-core'
    project(':symbian-core').projectDir = file('engines/symbian/core')
}

include ':storage-core'

if (providers.gradleProperty('wipiProbe').orNull == 'true') {
    include ':wipi-probe'
    project(':wipi-probe').projectDir = file('engines/wipi/bridge')
}

if (providers.gradleProperty('pieceProbe').orNull == 'true') {
    include ':piece-probe'
    project(':piece-probe').projectDir = file('engines/piece/bridge')
}

if (providers.gradleProperty('dingooProbe').orNull == 'true') {
    include ':dingoo-probe'
    project(':dingoo-probe').projectDir = file('engines/dingoo/bridge')
}

if (providers.gradleProperty('gp32Probe').orNull == 'true') {
    include ':gp32-probe'
    project(':gp32-probe').projectDir = file('engines/gp32/bridge')
}

if (providers.gradleProperty('supervisionProbe').orNull == 'true') {
    include ':supervision-probe'
    project(':supervision-probe').projectDir = file('engines/supervision/bridge')
}

if (providers.gradleProperty('megaduckProbe').orNull == 'true') {
    include ':megaduck-probe'
    project(':megaduck-probe').projectDir = file('engines/megaduck/bridge')
}

if (providers.gradleProperty('cybikoProbe').orNull == 'true') {
    include ':cybiko-probe'
    project(':cybiko-probe').projectDir = file('engines/cybiko/bridge')
}

if (providers.gradleProperty('flashProbe').orNull == 'true') {
    include ':flash-probe'
    project(':flash-probe').projectDir = file('engines/flash/bridge')
}
