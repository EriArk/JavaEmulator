pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
rootProject.name = "AbyssME"
include ':app', ':dexlib'
include ':peer-core'
project(':peer-core').projectDir = file('engines/peer/core')
if (['symbianExperiment', 'symbianRelease', 'symbianReleaseCheck'].any { providers.gradleProperty(it).orNull == 'true' }) {
    include ':symbian-core'
    project(':symbian-core').projectDir = file('engines/symbian/core')
}
