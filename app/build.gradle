plugins {
    id 'com.android.application'
}

def midletArchivesBaseName
def m3gExperiment = providers.gradleProperty('m3gExperiment').orNull
def m3gReleaseCheck = providers.gradleProperty('m3gReleaseCheck').orNull == 'true'
def symbianExperiment = providers.gradleProperty('symbianExperiment').orNull == 'true'
def symbianRelease = providers.gradleProperty('symbianRelease').orNull == 'true'
def symbianReleaseCheck = providers.gradleProperty('symbianReleaseCheck').orNull == 'true'
def symbianEnabled = symbianExperiment || symbianRelease || symbianReleaseCheck
if (symbianEnabled && m3gExperiment != null) {
    throw new GradleException('Run Symbian and M3G research builds separately')
}
if (m3gReleaseCheck && m3gExperiment == null) {
    throw new GradleException('m3gReleaseCheck requires an isolated candidate or baseline experiment')
}
if (m3gExperiment != null && m3gExperiment != 'candidate') {
    throw new GradleException('The legacy engine was removed. For baseline comparisons use a separate checkout at 05562126. Only m3gExperiment=candidate remains supported.')
}
if (m3gExperiment != null) {
    layout.buildDirectory.set(file("build/m3g-${m3gExperiment}" + (m3gReleaseCheck ? '-release-check' : '')))
}
if (symbianExperiment) {
    layout.buildDirectory.set(file('build/symbian-experiment'))
}
if (symbianRelease || symbianReleaseCheck) {
    layout.buildDirectory.set(file(symbianReleaseCheck ? 'build/symbian-release-check' : 'build/symbian-release'))
}

android {
    compileSdk COMPILE_SDK
    ndkVersion NDK_VERSION
    namespace 'ru.playsoftware.j2meloader'

    defaultConfig {
        applicationId "io.github.eriark.abyssme"
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        versionCode 305
        versionName "0.3.0-beta.6"
        resValue 'string', 'app_name', rootProject.name
        buildConfigField 'boolean', 'HANDHELD_MODE', 'true'
        buildConfigField 'boolean', 'SYMBIAN_EXPERIMENT', symbianEnabled.toString()
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (System.getenv()['BITRISE_IO']) {
                keyAlias System.getenv('BITRISEIO_ANDROID_KEYSTORE_ALIAS')
                keyPassword System.getenv('BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD')
                def keystoreName = System.getenv('BITRISEIO_ANDROID_KEYSTORE_NAME')
                if (keystoreName) storeFile rootProject.file(keystoreName)
                storePassword System.getenv('BITRISEIO_ANDROID_KEYSTORE_PASSWORD')
            } else if (m3gExperiment == null && rootProject.file('keystore.properties').isFile()) {
                Properties keystoreProps = new Properties()
                rootProject.file('keystore.properties').withInputStream { keystoreProps.load(it) }
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                if (keystoreProps['storeFile']) storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Rehearsals are deliberately debug-signed and never use production IDs/keys.
            signingConfig = (m3gReleaseCheck || symbianReleaseCheck) ? signingConfigs.debug : signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            jniDebuggable true
            multiDexEnabled true
            multiDexKeepProguard file('multidex-config.pro')
        }
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    flavorDimensions 'default'
    if (m3gExperiment != null) {
        if (m3gReleaseCheck) testBuildType 'release'
        variantFilter { variant ->
            variant.ignore = variant.buildType.name != (m3gReleaseCheck ? 'release' : 'debug') || !(variant.flavors*.name in [['fdroid'], ['phone']])
        }
        // A shared, isolated ID lets the baseline be upgraded to the candidate in place.
        defaultConfig.applicationId = m3gReleaseCheck ? 'io.github.eriark.abyssme.m3grehearsal' : "io.github.eriark.abyssme.m3g${m3gExperiment}"
    }
    productFlavors {
        play {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-play"
        }
        open {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-open"
        }
        fdroid {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
        }
        phone {
            applicationIdSuffix '.phone'
            versionNameSuffix '-phone'
            resValue 'string', 'app_name', 'AbyssME Phone'
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            buildConfigField 'boolean', 'HANDHELD_MODE', 'false'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
        }
        dev {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-dev-" + generateVersionCode()
        }
        // variant dimension for create android port from J2ME app source
        midlet {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'false'
            // configure midlet's port project params here, as default it read from app manifest,
            // placed to 'app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF'
            def props = getMidletManifestProperties()
            def midletName = props.getValue('MIDlet-Name').trim()
            def apkName = midletName.replaceAll('[/\\\\:*?\"<>|]', '').replace(' ', '_')
            applicationId "com.example.androidlet.${apkName.toLowerCase()}"
            versionName = props.getValue('MIDlet-Version')
            resValue 'string', 'app_name', midletName
            midletArchivesBaseName = apkName
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-midlet.pro', 'proguard-common.pro'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path '../engines/m3g/native/Android.mk'
        }
    }

    applicationVariants.all {
        if (buildType.name == 'debug' && flavorName != 'midlet') {
            resValue 'string', 'app_name', flavorName == 'phone'
                    ? 'AbyssME Phone Debug' : symbianExperiment ? 'AbyssME Symbian Test' : 'AbyssME Debug'
        }
        def baseName = flavorName == 'midlet' ? "${midletArchivesBaseName}-" : "${rootProject.name}-"
        outputs.all {
            outputFileName = "${baseName}${versionName}-${dirName}-${buildType.name}.apk"
                    .replaceAll('--+', '-').replaceAll(' +', '_')
        }
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        androidTest.assets.srcDir rootProject.file('test-games/sudoku-j2me')
    }
}

if (symbianEnabled) {
    if (symbianExperiment || symbianReleaseCheck) {
        android.defaultConfig.applicationId = symbianReleaseCheck ? 'io.github.eriark.abyssme.symbianrehearsal' : 'io.github.eriark.abyssme.symbian'
        android.defaultConfig.versionNameSuffix = '-symbian-experiment'
        android.defaultConfig.resValue 'string', 'app_name', 'AbyssME Symbian Test'
    }
    if (symbianReleaseCheck) {
        android.testBuildType 'release'
        android.buildTypes.release.testProguardFiles rootProject.file('experiments/m3g-host/release-test.pro')
        android.buildTypes.release.proguardFile rootProject.file('experiments/m3g-host/release-runner.pro')
        android.buildTypes.release.proguardFile rootProject.file('engines/symbian/release-test-boundaries.pro')
    }
    android.defaultConfig.ndk.abiFilters 'arm64-v8a'
    android.variantFilter { variant ->
        variant.ignore = (symbianExperiment && variant.buildType.name != 'debug') ||
                (symbianReleaseCheck && variant.buildType.name != 'release') || !(variant.flavors*.name in [['fdroid'], ['phone']])
    }
    dependencies { implementation project(':symbian-core') }
    android.sourceSets.androidTest.java.srcDir rootProject.file('engines/symbian/tests')
    android.sourceSets.main.java.srcDir rootProject.file('engines/symbian/app')
}

if (m3gExperiment != null) {
    apply from: rootProject.file('experiments/m3g-host/host.gradle')
} else {
    apply from: rootProject.file('engines/m3g/production.gradle')
    apply from: rootProject.file('engines/mophun/production.gradle')
}

def validateReleaseCredentials = tasks.register('validateReleaseCredentials') {
    doLast {
        def signing = android.signingConfigs.release
        if (!signing.storeFile || !signing.storePassword || !signing.keyAlias || !signing.keyPassword) {
            throw new GradleException('Release signing is not configured. Set storeFile, storePassword, keyAlias and keyPassword in keystore.properties (or the Bitrise signing environment). Debug builds do not require this file. See CONTRIBUTING.md.')
        }
    }
}
apply from: rootProject.file('tools/release-inventory.gradle')
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release' && !m3gReleaseCheck && !symbianReleaseCheck) {
        variant.preBuildProvider.configure { dependsOn validateReleaseCredentials }
    }
}

static def generateVersionCode() {
    try {
        def result = "git rev-list HEAD --count".execute().text.trim()
        return result.isInteger() ? result.toInteger() : 0
    } catch (IOException ignored) {
        // Source release archives do not require Git or its history to build.
        return 0
    }
}

def getMidletManifestProperties() {
    def file = project.file('src/midlet/resources/MIDLET-META-INF/MANIFEST.MF')
    def mf = new java.util.jar.Manifest()
    if (file.exists()) {
        def is = null
        try {
            is = new FileInputStream(file)
            mf.read(is)
        } finally {
            if (is != null) is.close()
        }
    }
    return mf.mainAttributes
}

dependencies {
    def roomVersion = '2.5.2'
    def cameraxVersion = "1.3.0-beta01"
    def autoServiceVersion = "1.0"

    implementation project(':dexlib')

    // Android Jetpack
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-rxjava2:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Networking && APIs
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.google.guava:guava:31.0.1-android'

    // Threads, Streams and Archives
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'net.lingala.zip4j:zip4j:2.10.0'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.tukaani:xz:1.9'

    // Audio/Video/Graphics
    implementation 'com.github.billthefarmer:mididriver:v1.21'
    implementation('com.github.nikita36078:pngj:2.2.3') {
        // Published as a runtime dependency upstream, but only used by PNGJ tests.
        exclude group: 'junit', module: 'junit'
    }
    implementation 'com.github.nikita36078:mobile-ffmpeg:v4.3.2-compact'

    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    // Android UI
    implementation 'com.github.nikita36078:filepicker:4.3.0'
    implementation 'com.github.yukuku:ambilwarna:2.0.1'

    // Testing && CrashReports
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'org.ow2.asm:asm:9.8'
    testImplementation 'junit:junit:4.13.2'
    implementation 'ch.acra:acra-dialog:5.9.3'

    // Other Libraries
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))
    compileOnly "com.google.auto.service:auto-service-annotations:$autoServiceVersion"
    annotationProcessor "com.google.auto.service:auto-service:$autoServiceVersion"
}
