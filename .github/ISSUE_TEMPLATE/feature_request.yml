name: Feature request
description: File a feature request
labels: enhancement
body:
  - type: textarea
    id: quick-summary
    attributes:
      label: Quick summary
      description: What would you like AbyssME to improve, and what problem would it solve?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Please describe the feature as accurately as possible.
    validations:
      required: false
