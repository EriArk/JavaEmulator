// Opt-in research APKs only; the ordinary application build keeps its engine.
def candidate = providers.gradleProperty('m3gExperiment').get() == 'candidate'
def measuring = providers.gradleProperty('m3gMeasure').orNull == 'true'
def tracing = providers.gradleProperty('m3gTrace').orNull == 'true'
// Same code/signing/package as the research APK, without ART's debug execution mode.
if (providers.gradleProperty('m3gNonDebuggable').orNull == 'true') {
    android.buildTypes.debug.debuggable = false
}
if (tracing && (!candidate || measuring)) throw new GradleException('Trace requires an unmeasured candidate')
def mophun = providers.gradleProperty('mophunSource').orNull
if (mophun != null) {
    if (!candidate) throw new GradleException('Combined research requires the GPL-compatible candidate')
    def local = rootProject.file(mophun)
    ['vendor', 'java', 'tests', 'AndroidManifest.xml', 'WOLPHUN-LICENSE'].each {
        if (!new File(local, it).exists()) throw new GradleException("Missing private Mophun input: ${it}")
    }
    android.sourceSets.debug.java.srcDirs new File(local, 'vendor'), new File(local, 'java')
    android.sourceSets.debug.manifest.srcFile new File(local, 'AndroidManifest.xml')
    android.sourceSets.androidTest.java.srcDir new File(local, 'tests')
    def fixtures = providers.gradleProperty('mophunTestGames').orNull
    if (fixtures != null) android.sourceSets.androidTest.assets.srcDir rootProject.file(fixtures)
}
def instrumentTarget = { String source, boolean alternative ->
    def patches = alternative ? [
        'private int[] androidFrameBuffer;': 'private int[] androidFrameBuffer;\n\tprivate long researchTargetStart;',
        'this.hints = hints;': 'this.hints = hints;\n\t\tresearchTargetStart = System.nanoTime();',
        'finally { this.target = null; }': 'finally { this.target = null; if (researchTargetStart != 0) org.abyssme.research.FrameMeter.recordTarget(System.nanoTime() - researchTargetStart); researchTargetStart = 0; }'
    ] : [
        'private java.lang.Object currentTarget = null;': 'private java.lang.Object currentTarget = null;\n\tprivate long researchTargetStart;',
        'depthEnabled = depth;': 'depthEnabled = depth;\n\t\tresearchTargetStart = System.nanoTime();',
        '\t\tcurrentTarget = null;': '\t\tcurrentTarget = null;\n\t\tif (researchTargetStart != 0) org.abyssme.research.FrameMeter.recordTarget(System.nanoTime() - researchTargetStart);\n\t\tresearchTargetStart = 0;'
    ]
    patches.each { before, after ->
        if (source.count(before) != 1) throw new GradleException("Target measurement hook drift: ${before}")
        source = source.replace(before, after)
    }
    source
}
android.applicationVariants.all { variant ->
    variant.resValue 'string', 'app_name', candidate ? 'AbyssME M3G Candidate' : 'AbyssME M3G Baseline'
}
android.defaultConfig.ndk.abiFilters 'arm64-v8a', 'x86_64'
android.sourceSets.androidTest.java.srcDir rootProject.file('experiments/m3g-host/tests')

if (measuring) {
    def measured = layout.buildDirectory.dir('generated/measured-host')
    def canvas = file('src/main/java/javax/microedition/lcdui/Canvas.java')
    android.sourceSets.main.java.exclude { element -> element.file == canvas }
    android.sourceSets.main.java.srcDir measured
    android.sourceSets.main.java.srcDir rootProject.file('experiments/m3g-host/measurement-java')
    android.sourceSets.androidTest.java.srcDir rootProject.file('experiments/m3g-host/measurement-tests')
    def baselineGraphics = file('src/main/java/javax/microedition/m3g/Graphics3D.java')
    if (!candidate) android.sourceSets.main.java.exclude { element -> element.file == baselineGraphics }
    tasks.register('prepareMeasuredHost') {
        outputs.upToDateWhen { false }
        doLast {
            def text = canvas.getText('UTF-8').replace('\r\n', '\n')
            def paint = 'paint(g);'
            def flush = '\t\trequestFlushToScreen();'
            if (text.count(paint) != 1 || text.count(flush + '\n\t}') != 2) {
                throw new GradleException('Canvas measurement hook drift')
            }
            text = text.replace(paint, 'long measureStart = System.nanoTime();\n\t\t\t\tpaint(g);\n\t\t\t\torg.abyssme.research.FrameMeter.record(System.nanoTime() - measureStart);')
            text = text.replace(flush + '\n\t}', '\t\torg.abyssme.research.FrameMeter.record(-1);\n' + flush + '\n\t}')
            def target = new File(measured.get().asFile, 'javax/microedition/lcdui/Canvas.java')
            target.parentFile.mkdirs()
            target.setText(text, 'UTF-8')
            if (!candidate) {
                def graphics = new File(measured.get().asFile, 'javax/microedition/m3g/Graphics3D.java')
                graphics.parentFile.mkdirs()
                graphics.setText(instrumentTarget(baselineGraphics.getText('UTF-8'), false), 'UTF-8')
            }
        }
    }
    tasks.named('preBuild').configure { dependsOn 'prepareMeasuredHost' }
}

if (candidate) {
    android.defaultConfig.buildConfigField 'boolean', 'M3G_GPU', providers.gradleProperty('m3gGpu').orNull == 'true' ? 'true' : 'false'
    android.sourceSets.androidTest.java.srcDir rootProject.file('experiments/m3g-host/candidate-tests')
    def originalTonePlayer = file('src/main/java/javax/microedition/media/TonePlayer.java')
    def originalManager = file('src/main/java/javax/microedition/media/Manager.java')
    android.sourceSets.main.java.exclude { element -> element.file == originalTonePlayer || element.file == originalManager }
    def toneHost = layout.buildDirectory.dir('generated/tone-host')
    android.sourceSets.main.java.srcDir toneHost
    tasks.register('prepareToneHost') {
        outputs.upToDateWhen { false }
        doLast {
            def text = originalManager.getText('UTF-8')
            def hook = 'return new MicroPlayer(new InternalDataSource(stream, type));'
            if (text.count(hook) != 2) throw new GradleException('Tone stream routing hook drift')
            text = text.replace(hook, 'if ("audio/x-tone-seq".equalsIgnoreCase(type)) return new TonePlayer(stream);\n\t\t\t' + hook)
            def output = new File(toneHost.get().asFile, 'javax/microedition/media/Manager.java')
            output.parentFile.mkdirs()
            output.setText(text, 'UTF-8')
        }
    }
    tasks.named('preBuild').configure { dependsOn 'prepareToneHost' }
    def legacyTone = file('src/main/java/javax/microedition/media/tone').toPath()
    android.sourceSets.main.java.exclude { element -> element.file.toPath().startsWith(legacyTone) }
    android.sourceSets.main.java.srcDir rootProject.file('experiments/m3g-host/tone-java')
    android.sourceSets.androidTest.java.srcDir rootProject.file('experiments/m3g-host/tone-android-tests')
    def toneChecks = configurations.create('toneChecks')
    dependencies.add('toneChecks', 'junit:junit:4.13.2')
    def toneClasses = layout.buildDirectory.dir('tone-checks/classes')
    def compileTone = tasks.register('compileToneChecks', JavaCompile) {
        source rootProject.file('experiments/m3g-host/tone-java/javax/microedition/media/tone/ToneSequence.java')
        source rootProject.file('experiments/m3g-host/tone-tests')
        source file('src/main/java/javax/microedition/media/control/ToneControl.java')
        source file('src/main/java/javax/microedition/media/Control.java')
        classpath = toneChecks
        destinationDirectory = toneClasses
        options.release = 8
    }
    tasks.register('testToneCompiler', Test) {
        dependsOn compileTone
        testClassesDirs = files(toneClasses)
        classpath = files(toneClasses) + toneChecks
    }
    if (tracing) android.sourceSets.main.java.srcDir rootProject.file('experiments/m3g-host/trace-java')
    apply from: rootProject.file('experiments/m3g-probe/prepare-candidate.gradle')
    def original = file('src/main/java/javax/microedition/m3g').toPath()
    android.sourceSets.main.java.exclude { element -> element.file.toPath().startsWith(original) }
    android.sourceSets.main.java.srcDir m3gGenerated.map { new File(it.asFile, 'java') }
    android.sourceSets.main.java.srcDir rootProject.file('experiments/m3g-host/java')
    if (measuring) {
        def adapter = rootProject.file('experiments/m3g-host/java/org/recompile/mobile/PlatformGraphics.java')
        android.sourceSets.main.java.exclude { element -> element.file == adapter }
    }
    android.sourceSets.main.assets.srcDir m3gGenerated.map { new File(it.asFile, 'assets') }
    android.externalNativeBuild.ndkBuild.path = rootProject.file('experiments/m3g-host/native/Android.mk')
    android.defaultConfig.externalNativeBuild.ndkBuild.targets 'micro3d', 'abyssm3graster'
    android.packaging.jniLibs.excludes.add('**/libjavam3g.so')
    tasks.register('adaptM3gHost') {
        dependsOn 'prepareM3g'
        doLast {
            def source = new File(m3gGenerated.get().asFile, 'java/javax/microedition/m3g/Graphics3D.java')
            def text = source.getText('UTF-8')
            def patches = [
                'private static Graphics3D instance = null;': 'private static Graphics3D instance = null;\n\tprivate int[] androidFrameBuffer;',
                'rasterData = ((PlatformGraphics) pgrp).getFrameBuffer();': 'rasterData = androidFrameBuffer = PlatformGraphics.read(pgrp, androidFrameBuffer);',
                'final PlatformGraphics pgrp = (PlatformGraphics) this.target;': 'final PlatformGraphics pgrp = new PlatformGraphics((Graphics) this.target);',
                'this.target = null;': 'try { if (this.target instanceof Graphics) PlatformGraphics.flush((Graphics) this.target, rasterData); } finally { this.target = null; }',
                'public static Graphics3D getInstance()': 'public static void initGraphics3D() { instance = null; }\n\tpublic static Graphics3D getInstance()'
            ]
            patches.each { before, after ->
                if (text.count(before) != 1) throw new GradleException("Host patch drift: ${before}")
                text = text.replace(before, after)
            }
            def nativeFields = 'private int[] androidFrameBuffer;'
            def emptyMesh = 'boolean hasColors = trisScreen[0].hasVertexColors();'
            if (text.count(emptyMesh)!=1) throw new GradleException('Empty mesh guard drift')
            text = text.replace(emptyMesh,
                    'if (renderableTriangles[0] == 0) { GpuRasterizer.emptyDraws++; return; }\n\t\t' + emptyMesh)
            def gpuHook = '\n\t\tfor (int tri_id = 0; tri_id < renderableTriangles[0]; tri_id++)'
            if (text.count(gpuHook)!=1) throw new GradleException('GPU submesh hook drift')
            text = text.replace(gpuHook, rootProject.file('experiments/m3g-host/gpu/mesh-hook.java.inc').getText('UTF-8') + gpuHook)
            text = text.replace('public static void initGraphics3D() { instance = null; }',
                    'public static void initGraphics3D() { GpuRasterizer.close(); instance = null; }')
            ['public void bindTarget(Object target, boolean depthBuffer, int hints)',
             'public void clear(Background background)', 'public void releaseTarget()',
             'private void renderSprite(Sprite3D sprite, Transform transform, int alphaFactor)'].each { signature ->
                def barrier = signature + '\n\t{'
                if (text.count(barrier)!=1) throw new GradleException("GPU barrier drift: ${signature}")
                text = text.replace(barrier, barrier + '\n        GpuRasterizer.flush();')
            }
            if (text.count(nativeFields) != 1) throw new GradleException('Native state field drift')
            text = text.replace(nativeFields, nativeFields + '\n    private final float[] nativeState = new float[51];\n    private final int[] nativeFlags = new int[45];\n    private final int[][] nativeImages = new int[4][];')
            def nativeHook = 'int rowIdx = (originY + viewy + yStart) * canvasWidth + originX + viewx;'
            if (text.count(nativeHook) != 1) throw new GradleException('Native half hook drift')
            text = text.replace(nativeHook, nativeHook + '\n' + rootProject.file('experiments/m3g-host/native/half-hook.java.inc').getText('UTF-8'))
            def spriteHook = 'for (int y = pixT; y < pixB; y++)'
            if (text.count(spriteHook) != 1) throw new GradleException('Native sprite hook drift')
            text = text.replace(spriteHook, rootProject.file('experiments/m3g-host/native/sprite-hook.java.inc').getText('UTF-8') + '\n\t\t' + spriteHook)
            text = text.replace(nativeFields, nativeFields + '''
    private final float[] nativeSpriteState = new float[4];
    private final int[] nativeSpriteFlags = new int[20];
    private final float[] nativeMipState = new float[18];
    private final int[] nativeMipFlags = new int[8];
    private final int[][] nativeMipImages = new int[64][];''')
            if (tracing) {
                def hook = 'this.currAlphaFactor = alphaFactor;'
                if (text.count(hook) != 1) throw new GradleException('Trace hook drift')
                text = text.replace(hook, hook + '\n\t\tRenderStateTrace.record(vertices, appearance, alphaFactor);')
            }
            if (measuring) {
                ['renderSubmesh': ['VertexBuffer vertices, IndexBuffer triangles, Appearance appearance, Transform transform, int scope, int alphaFactor', 'vertices, triangles, appearance, transform, scope, alphaFactor'],
                 'renderSprite': ['Sprite3D sprite, Transform transform, int alphaFactor', 'sprite, transform, alphaFactor']].each { name, args ->
                    def signature = 'private void ' + name + '(' + args[0] + ')'
                    if (text.count(signature) != 1) throw new GradleException("Draw measurement hook drift: ${name}")
                    text = text.replace(signature, signature + ''' {
        long start = System.nanoTime();
        try { ''' + name + 'Measured(' + args[1] + '''); }
        finally { org.abyssme.research.FrameMeter.recordPhase(2, System.nanoTime() - start); }
    }
    private void ''' + name + 'Measured(' + args[0] + ')')
                }
                def adapter = rootProject.file('experiments/m3g-host/java/org/recompile/mobile/PlatformGraphics.java').getText('UTF-8')
                ['bitmap.getPixels(pixels, 0, width, 0, 0, width, height);',
                 'bitmap.setPixels(pixels, 0, bitmap.getWidth(), 0, 0, bitmap.getWidth(), bitmap.getHeight());'].eachWithIndex { hook, phase ->
                    if (adapter.count(hook) != 1) throw new GradleException('Bitmap timing hook drift')
                    adapter = adapter.replace(hook, 'long start = System.nanoTime();\n        ' + hook + '\n        org.abyssme.research.FrameMeter.recordPhase(' + phase + ', System.nanoTime() - start);')
                }
                def output = new File(m3gGenerated.get().asFile, 'java/org/recompile/mobile/PlatformGraphics.java')
                output.parentFile.mkdirs()
                output.setText(adapter, 'UTF-8')
            }
            source.setText(measuring ? instrumentTarget(text, true) : text, 'UTF-8')
        }
    }
    tasks.named('preBuild').configure { dependsOn 'adaptM3gHost' }
}
