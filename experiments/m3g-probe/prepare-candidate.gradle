def pinnedRevision = 'baca76a4dda6f30abac67fb4a3db009eed05f91c'
def upstream = providers.gradleProperty('freej2meSource')
def generated = layout.buildDirectory.dir('generated/m3g')

tasks.register('prepareM3g') {
    outputs.upToDateWhen { false }
    doLast {
        if (!upstream.isPresent()) {
            throw new GradleException('Pass -Pfreej2meSource=<pinned FreeJ2ME-Plus checkout>')
        }
        def source = file(upstream.get())
        def revision = new ByteArrayOutputStream()
        exec { workingDir source; commandLine 'git', 'rev-parse', 'HEAD'; standardOutput revision }
        if (revision.toString('UTF-8').trim() != pinnedRevision) {
            throw new GradleException("Expected FreeJ2ME-Plus ${pinnedRevision}")
        }
        def dirty = new ByteArrayOutputStream()
        exec {
            workingDir source
            commandLine 'git', 'status', '--porcelain', '--', 'src/javax/microedition/m3g', 'LICENSE'
            standardOutput dirty
        }
        if (dirty.size() != 0) throw new GradleException('Upstream M3G sources must be unmodified')
        def output = generated.get().asFile
        delete output
        copy {
            from new File(source, 'src/javax/microedition/m3g')
            include '*.java'
            into new File(output, 'java/javax/microedition/m3g')
        }
        // Android has no AWT. Keep the MIDP Image path and fail if upstream drifts.
        def image = new File(output, 'java/javax/microedition/m3g/Image2D.java')
        def oldCheck = ' && !(image instanceof java.awt.Image)'
        def contents = image.getText('UTF-8')
        if (contents.count(oldCheck) != 1) throw new GradleException('Image2D adaptation no longer matches')
        image.setText(contents.replace(oldCheck, ''), 'UTF-8')
        // available() shrinks while 'read' grows; comparing them skips later sections.
        // Keep the header's end boundary, including for embedded files with trailing data.
        def loader = new File(output, 'java/javax/microedition/m3g/Loader.java')
        def oldBoundary = 'while ((bounded ? read < Math.min(dis.available(), totalFileSize) : dis.available() > 0))'
        def newBoundary = 'while (bounded ? read < totalFileSize : dis.available() > 0)'
        contents = loader.getText('UTF-8')
        if (contents.count(oldBoundary) != 1) throw new GradleException('Loader boundary patch no longer matches')
        loader.setText(contents.replace(oldBoundary, newBoundary), 'UTF-8')
        // Clamp the continuous texel position before splitting neighbors/fraction.
        // Clamping only the first neighbor blends an edge with the next texel.
        def raster = new File(output, 'java/javax/microedition/m3g/Graphics3D.java')
        contents = raster.getText('UTF-8')
        def filterPatches = [
            'final int sFixed = (int) (s * 256.0f) - 128;': 'int sFixed = (int) (s * 256.0f) - 128;',
            'final int tFixed = (int) (t * 256.0f) - 128;': '''int tFixed = (int) (t * 256.0f) - 128;
                if (!texRepeatS[unitIdx]) sFixed = Math.max(0, Math.min((texW - 1) << 8, sFixed));
                if (!texRepeatT[unitIdx]) tFixed = Math.max(0, Math.min((texH - 1) << 8, tFixed));'''
        ]
        filterPatches.each { before, after ->
            if (contents.count(before) != 1) throw new GradleException("Texture clamp patch drift: ${before}")
            contents = contents.replace(before, after)
        }
        // Parallel projection has w=1: recover eye depth before viewport/depth mapping.
        def fogPatches = [
            'private int currAlphaFactor = 256;': '''private int currAlphaFactor = 256;
    private boolean parallelFog;
    private float[] parallelFogDepth = new float[0];
    private final float[] fogProjection = new float[16];
    private float fogEyeA, fogEyeDx, fogEyeDy;''',
            'Triangle.transform(trisScreen, renderableTriangles[0], tr, textr, hasTexture);': '''parallelFog = fog != null && projType == Camera.PARALLEL;
        if (parallelFog) {
            projectionMatrix.get(fogProjection);
            int count = renderableTriangles[0] * 3;
            if (parallelFogDepth.length < count) parallelFogDepth = new float[count];
            for (int i = 0; i < renderableTriangles[0]; i++) {
                Triangle triangle = trisScreen[i];
                parallelFogDepth[i * 3] = (fogProjection[11] - triangle.zA()) / fogProjection[10];
                parallelFogDepth[i * 3 + 1] = (fogProjection[11] - triangle.zB()) / fogProjection[10];
                parallelFogDepth[i * 3 + 2] = (fogProjection[11] - triangle.zC()) / fogProjection[10];
            }
        }
        Triangle.transform(trisScreen, renderableTriangles[0], tr, textr, hasTexture);''',
            'final float invDet = M3GMath.fastReciprocal(denominator);': '''final float invDet = M3GMath.fastReciprocal(denominator);
            if (parallelFog) {
                fogEyeA = parallelFogDepth[tri_id * 3];
                float db = parallelFogDepth[tri_id * 3 + 1] - fogEyeA;
                float dc = parallelFogDepth[tri_id * 3 + 2] - fogEyeA;
                fogEyeDx = (db * dyC - dc * dyB) * invDet;
                fogEyeDy = (dc * dxB - db * dxC) * invDet;
            }''',
            'float zEyeStart = invPw;': 'float zEyeStart = parallelFog ? fogEyeA + (x - triScreen.xA()) * fogEyeDx + (y - triScreen.yA()) * fogEyeDy : invPw;',
            'float zEyeEnd = invPw + stepInvPw * spanLen;': 'float zEyeEnd = parallelFog ? zEyeStart + fogEyeDx * spanLen : invPw + stepInvPw * spanLen;'
        ]
        fogPatches.each { before, after ->
            if (contents.count(before) != 1) throw new GradleException("Parallel fog patch drift: ${before}")
            contents = contents.replace(before, after)
        }
        raster.setText(contents, 'UTF-8')
        // An empty light list does not disable emissive color or diffuse alpha.
        def triangle = new File(output, 'java/javax/microedition/m3g/Triangle.java')
        contents = triangle.getText('UTF-8')
        def oldLighting = 'lights != null && !lights.isEmpty()'
        if (contents.count(oldLighting) != 1) throw new GradleException('Material lighting patch drift')
        triangle.setText(contents.replace(oldLighting, 'lights != null'), 'UTF-8')
        copy { from new File(source, 'LICENSE'); into new File(output, 'assets'); rename { 'FREEJ2ME-LICENSE.txt' } }
    }
}

ext.m3gGenerated = generated
