ext.m3gPatchDirectory = rootProject.file('experiments/m3g-probe')
if (!m3gPatchDirectory.isDirectory()) ext.m3gPatchDirectory = rootProject.projectDir
apply from: new File(m3gPatchDirectory, 'source.gradle')
def pinnedRevision = m3gPinnedRevision
def upstream = providers.gradleProperty('freej2meSource')
def generated = layout.buildDirectory.dir('generated/m3g')

tasks.register('prepareM3g') {
    if (!upstream.isPresent()) dependsOn 'prepareM3gUpstream'
