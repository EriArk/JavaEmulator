plugins { id 'com.android.application' }
apply from: '../prepare-candidate.gradle'

android {
    namespace 'io.github.eriark.m3gprobe'
    compileSdk 34
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    defaultConfig {
        applicationId 'io.github.eriark.m3gprobe'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '0.2-scenes'
        buildConfigField 'boolean', 'BASELINE', 'false'
    }
    sourceSets {
        main.java.srcDir 'src/candidate/java'
        main.java.srcDir m3gGenerated.map { new File(it.asFile, 'java') }
        main.assets.srcDir m3gGenerated.map { new File(it.asFile, 'assets') }
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareM3g' }
