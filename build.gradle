// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.5.1' apply false
    id 'com.android.library' version '8.5.1' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    def requestedJobs = providers.gradleProperty('nativeBuildJobs').orNull
    if (requestedJobs != null && !(requestedJobs ==~ /[1-8]/)) {
        throw new GradleException('nativeBuildJobs must be an integer from 1 to 8')
    }
    nativeBuildJobs = requestedJobs
    COMPILE_SDK = 34
    MIN_SDK = 29
    TARGET_SDK = 34
    NDK_VERSION = '22.1.7171670'
}
