plugins { id 'com.android.library' }
android {
    namespace 'io.github.eriark.abyssme.flash.bridge'
    compileSdk 34
    defaultConfig { minSdk 29 }
    sourceSets.main.assets.srcDir rootProject.file('build/flash/assets')
}
if (!rootProject.file('build/flash/assets/flash/ruffle.js').isFile())
    throw new GradleException('Run python3 engines/flash/prepare.py before enabling the Flash Lite runtime')

def stickers = tasks.register('prepareFlashStickers', Sync) {
    from(rootProject.file('design-concepts/platform-stickers')) {
        include 'flash.webp'
        rename { name -> "sticker_" + name }
    }
    into layout.buildDirectory.dir('generated/deviceArt/drawable-nodpi')
}
android.sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/deviceArt')
tasks.named('preBuild').configure { dependsOn stickers }
