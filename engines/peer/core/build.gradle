plugins { id 'com.android.library' }

def armv7 = providers.gradleProperty('armv7').orNull == 'true'
if (armv7) layout.buildDirectory.set(file('build/armv7'))

android {
    namespace 'io.github.eriark.abyssme.peer'
    compileSdk 34
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 29
        if (armv7) {
            ndk { abiFilters 'armeabi-v7a' }
        } else if (['symbianRelease', 'symbianExperiment', 'symbianReleaseCheck'].any {
                providers.gradleProperty(it).orNull == 'true' }) {
            ndk { abiFilters 'arm64-v8a' }
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', "-DPEER_OFFLINE=${gradle.startParameter.offline ? 'ON' : 'OFF'}",
                        "-DPEER_SOURCE_ROOT=${rootProject.file('build/peer-sources').absolutePath.replace('\\', '/')}"
                targets 'abyss-peer'
                if (rootProject.nativeBuildJobs != null) {
                    arguments "-DCMAKE_JOB_POOLS=abyss_compile=${rootProject.nativeBuildJobs};abyss_link=1",
                            '-DCMAKE_JOB_POOL_COMPILE=abyss_compile', '-DCMAKE_JOB_POOL_LINK=abyss_link'
                }
            }
        }
        consumerProguardFiles 'consumer-rules.pro'
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}

// CMake verifies every source revision before compiling. Preserve upstream notices
// in the APK as well as the corresponding-source bundle.
def noticeFiles = [
        'libdatachannel/LICENSE': 'libdatachannel-MPL-2.0.txt',
        'libdatachannel/deps/libjuice/LICENSE': 'libjuice-MPL-2.0.txt',
        'libdatachannel/deps/plog/LICENSE': 'plog-MIT.txt',
        'libdatachannel/deps/usrsctp/LICENSE.md': 'usrsctp-BSD.txt',
        'mbedtls/LICENSE': 'mbedtls-LICENSE.txt']
['Debug', 'Release'].each { variant ->
    def assetsDirectory = layout.buildDirectory.dir("peer-assets/${variant.toLowerCase()}")
    android.sourceSets[variant.toLowerCase()].assets.srcDir assetsDirectory
    def notices = tasks.register("peer${variant}Notices", Sync) {
        dependsOn "externalNativeBuild${variant}"
        into assetsDirectory.map { it.dir('licenses/peer') }
        noticeFiles.each { source, targetName ->
            from(rootProject.file("build/peer-sources/${source}")) { rename { targetName } }
        }
        doFirst {
            noticeFiles.each { source, name ->
                def origin = rootProject.file("build/peer-sources/${source}")
                if (!origin.isFile()) throw new GradleException("Missing peer notice: ${source}")
            }
        }
    }
    tasks.configureEach {
        if (name == "merge${variant}Assets" || name == "package${variant}Assets" ||
                (name.contains(variant) && name.toLowerCase().contains('lint'))) dependsOn notices
    }
}

tasks.register('peerSourceBundle', Zip) {
    dependsOn 'externalNativeBuildRelease'
    archiveFileName = 'abyssme-peer-corresponding-source.zip'
    destinationDirectory = rootProject.layout.buildDirectory.dir('release-sources')
    from(rootProject.file('build/peer-sources')) {
        include 'libdatachannel/**', 'mbedtls/**'
        exclude '**/.git/**', '**/.git', '**/.github/**'
        into 'upstream'
    }
    from(projectDir) { exclude 'build/**', '.cxx/**'; into 'abyssme-wrapper' }
}
