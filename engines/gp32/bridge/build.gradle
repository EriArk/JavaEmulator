plugins { id 'com.android.library' }
android {
    namespace 'io.github.eriark.abyssme.gp32.bridge'
    compileSdk 34
    defaultConfig { minSdk 29 }
    sourceSets.main.jniLibs.srcDir rootProject.file('build/gp32/jniLibs')
}
if (!rootProject.file('build/gp32/jniLibs/arm64-v8a/libabyssgp32.so').isFile())
    throw new GradleException('Build the pinned Gp32 frontend first (engines/gp32/README.md)')

def stickers = tasks.register('prepareGp32Stickers', Sync) {
    from(rootProject.file('design-concepts/platform-stickers')) {
        include 'gp32.webp'
        rename { name -> "sticker_" + name }
    }
    into layout.buildDirectory.dir('generated/deviceArt/drawable-nodpi')
}
android.sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/deviceArt')
tasks.named('preBuild').configure { dependsOn stickers }
