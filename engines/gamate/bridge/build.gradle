plugins { id 'com.android.library' }
android {
    namespace 'io.github.eriark.abyssme.gamate.bridge'
    compileSdk 34
    defaultConfig { minSdk 29 }
    sourceSets.main.jniLibs.srcDir rootProject.file('build/gamate/jniLibs')
}
if (!rootProject.file('build/gamate/jniLibs/arm64-v8a/libabyssgamate.so').isFile())
    throw new GradleException('Build the pinned Gamate frontend first (engines/gamate/README.md)')

def stickers = tasks.register('prepareGamateStickers', Sync) {
    from(rootProject.file('design-concepts/platform-stickers')) {
        include 'gamate.webp'
        rename { name -> "sticker_" + name }
    }
    into layout.buildDirectory.dir('generated/deviceArt/drawable-nodpi')
}
android.sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/deviceArt')
tasks.named('preBuild').configure { dependsOn stickers }
