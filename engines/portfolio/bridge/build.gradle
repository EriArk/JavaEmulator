plugins { id 'com.android.library' }
android {
    namespace 'io.github.eriark.abyssme.portfolio.bridge'
    compileSdk 34
    defaultConfig { minSdk 29 }
}
def stickers = tasks.register('preparePortfolioStickers', Sync) {
    from(rootProject.file('design-concepts/platform-stickers')) {
        include 'portfolio.webp'
        rename { name -> "sticker_" + name }
    }
    into layout.buildDirectory.dir('generated/deviceArt/drawable-nodpi')
}
android.sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/deviceArt')
tasks.named('preBuild').configure { dependsOn stickers }

def frameworkAssets = rootProject.file('build/portfolio/assets')
android.sourceSets.main.assets.srcDir frameworkAssets
tasks.named('preBuild').configure {
    doFirst {
        if (!new File(frameworkAssets, 'portfolio/core/js/emu/machine.js').isFile()) {
            throw new GradleException('Prepare Portfoliator with python3 engines/portfolio/prepare.py <portfoliator checkout>')
        }
    }
}
