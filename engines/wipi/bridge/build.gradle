plugins { id 'com.android.library' }

android {
    namespace 'io.github.eriark.abyssme.wipi.bridge'
    compileSdk 34
    defaultConfig { minSdk 29 }
    sourceSets.main.jniLibs.srcDir rootProject.file('build/wipi/jniLibs')
}
if (!rootProject.file('build/wipi/jniLibs/arm64-v8a/libwipi_android.so').isFile()) {
    throw new GradleException('Build the pinned WIPI native bridge first (engines/wipi/README.md)')
}
