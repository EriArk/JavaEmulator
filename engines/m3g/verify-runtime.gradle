def productionAbi = providers.gradleProperty('armv7').orNull == 'true' ? 'armeabi-v7a' : 'arm64-v8a'
tasks.register('verifyProductionApks') {
    dependsOn 'assembleFdroidRelease'
    doLast {
        ['fdroid'].each { flavor ->
            def folder = layout.buildDirectory.dir("outputs/apk/$flavor/release").get().asFile
            def metadata = new groovy.json.JsonSlurper().parse(new File(folder, 'output-metadata.json'))
            def forbidden = ['Ljavax/microedition/m3g/Platform;',
                'Ljavax/microedition/media/tone/BlockEndEvent;',
                'Ljavax/microedition/media/tone/BlockStartEvent;',
                'Ljavax/microedition/media/tone/Event;',
                'Ljavax/microedition/media/tone/EventList;',
                'Ljavax/microedition/media/tone/MidiSequence;',
                'Ljavax/microedition/media/tone/MidiSequenceException;',
                'Ljavax/microedition/media/tone/PlayBlockEvent;',
                'Ljavax/microedition/media/tone/RepeatEvent;',
                'Ljavax/microedition/media/tone/ToneEvent;',
                'Ljavax/microedition/media/tone/VolumeEvent;',
                'Lorg/abyssme/research/FrameMeter;',
                'Lru/playsoftware/j2meloader/multiplayer/GameNetworkProbeService;',
                'Lru/playsoftware/j2meloader/mophun/MophunPreviewActivity;']
            new java.util.zip.ZipFile(new File(folder, metadata.elements[0].outputFile)).withCloseable { zip ->
                ["lib/${productionAbi}/libabyssaudiobridge.so", "lib/${productionAbi}/libmidi.so",
                 "lib/${productionAbi}/libavcodec.so", "lib/${productionAbi}/libavformat.so",
                 "lib/${productionAbi}/libavutil.so", 'assets/licenses/AUDIO-BRIDGE.txt'].each {
                    if (zip.getEntry(it) == null) throw new GradleException("Missing audio backend/notice: $it")
                }
                ['assets/FREEJ2ME-LICENSE.txt', 'assets/FREEJ2ME-SOURCE.json',
                 'assets/licenses/WOLPHUN-GPL-3.0.txt', 'assets/licenses/NOFUN-APACHE-2.0.txt',
                 'assets/licenses/FSR-MIT.txt', 'assets/licenses/RETRO-SHADERS.txt',
                 'assets/shaders/retro/xbrz.glsl', 'assets/shaders/retro/xbrz-resolve.glsl',
                 'assets/shaders/retro/crt-easymode.glsl'].each {
                    if (zip.getEntry(it) == null) throw new GradleException("Missing notice: $it")
                }
                ["lib/${productionAbi}/libabyss-peer.so",
                 'assets/licenses/peer/libdatachannel-MPL-2.0.txt',
                 'assets/licenses/peer/libjuice-MPL-2.0.txt',
                 'assets/licenses/peer/plog-MIT.txt',
                 'assets/licenses/peer/mbedtls-LICENSE.txt',
                 'assets/licenses/peer/usrsctp-BSD.txt'].each {
                    if (zip.getEntry(it) == null) throw new GradleException("Missing experimental multiplayer payload/notice: $it")
                }
                if (productionAbi == 'armeabi-v7a') {
                    ['libmicro3d.so', 'libabyssm3graster.so'].each {
                        if (zip.getEntry("lib/armeabi-v7a/$it") == null)
                            throw new GradleException("Missing ARMv7 backend: $it")
                    }
                    zip.entries().each { entry ->
                        if (entry.name.startsWith('lib/') && !entry.name.startsWith('lib/armeabi-v7a/'))
                            throw new GradleException("Unexpected ABI in ARMv7 APK: ${entry.name}")
                        if (entry.name.contains('libabysssymbian') || entry.name.startsWith('assets/resources/') ||
                                entry.name.startsWith('assets/licenses/symbian/'))
                            throw new GradleException("Symbian payload in Java/Mophun APK: ${entry.name}")
                        if (entry.name.startsWith('lib/') && entry.name.endsWith('.so')) {
                            byte[] header = zip.getInputStream(entry).withCloseable { it.readNBytes(20) }
                            if (header.length != 20 || header[0] != 0x7f || header[1] != 69 ||
                                    header[2] != 76 || header[3] != 70 || header[4] != 1 || header[5] != 1 ||
                                    header[18] != 40 || header[19] != 0)
                                throw new GradleException("Not a 32-bit ARM ELF: ${entry.name}")
                        }
                    }
                }
                zip.entries().each { entry ->
                    if (entry.name.endsWith('/libjavam3g.so') || entry.name ==~ /(?i).+\.(mpn|jar|jad)$/) {
                        throw new GradleException("Unwanted runtime payload: ${entry.name}")
                    }
                    if (entry.name ==~ /classes[0-9]*\.dex/) {
                        def text = zip.getInputStream(entry).withCloseable { new String(it.bytes, 'ISO-8859-1') }
                        forbidden.each { if (text.contains(it)) throw new GradleException("Legacy/research class in $flavor APK: $it. Clean and rebuild.") }
                    }
                }
                if (providers.gradleProperty('symbianRelease').orNull == 'true') {
                    ['lib/arm64-v8a/libabysssymbian.so', 'assets/resources/generaluser-gs.sf2',
                     'assets/licenses/GeneralUser-GS.txt', 'assets/licenses/symbian/00-eka2l1.txt'].each {
                        if (zip.getEntry(it) == null) throw new GradleException("Missing Symbian release payload: $it")
                    }
                    zip.entries().each { entry ->
                        if (entry.name ==~ /(?i).+\.(sis|sisx|n-gage|rom|rpkg|hsb)$/ ||
                                entry.name.contains('/.git') || entry.name.startsWith('assets/scripts/') ||
                                entry.name == 'assets/resources/defaultbank.sf2') {
                            throw new GradleException("Unreviewed Symbian payload: ${entry.name}")
                        }
                    }
                    println "$flavor: Symbian engine/notices present; no phone dumps, game packages or old sound banks"
                }
                println "$flavor: legacy renderer/tone and private game/preview payloads absent; engine notices present"
            }
        }
    }
}
