plugins { id 'com.android.library' }
android {
    namespace 'io.github.eriark.abyssme.cybiko.bridge'
    compileSdk 34
    defaultConfig { minSdk 29 }
    sourceSets.main.jniLibs.srcDir rootProject.file('build/cybiko/jniLibs')
}
if (!rootProject.file('build/cybiko/jniLibs/arm64-v8a/libabysscybiko.so').isFile())
    throw new GradleException('Build the pinned Cybiko frontend first (engines/cybiko/README.md)')

def stickers = tasks.register('prepareCybikoStickers', Sync) {
    from(rootProject.file('design-concepts/platform-stickers')) {
        include 'cybiko.webp'
        rename { name -> "sticker_" + name }
    }
    into layout.buildDirectory.dir('generated/deviceArt/drawable-nodpi')
}
android.sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/deviceArt')
tasks.named('preBuild').configure { dependsOn stickers }
