plugins { id 'com.android.library' }
android {
    namespace 'io.github.eriark.abyssme.dingoo.bridge'
    compileSdk 34
    defaultConfig { minSdk 29 }
    sourceSets.main.jniLibs.srcDir rootProject.file('build/dingoo/jniLibs')
}
if (!rootProject.file('build/dingoo/jniLibs/arm64-v8a/libabyssdingoo.so').isFile())
    throw new GradleException('Build the pinned Dingoo frontend first (engines/dingoo/README.md)')

def stickers = tasks.register('prepareDingooStickers', Sync) {
    from(rootProject.file('design-concepts/platform-stickers')) {
        include 'dingoo.webp', 'gemei.webp'
        rename { name -> "sticker_" + name }
    }
    into layout.buildDirectory.dir('generated/deviceArt/drawable-nodpi')
}
android.sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/deviceArt')
tasks.named('preBuild').configure { dependsOn stickers }
